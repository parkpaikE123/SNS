spring:
    config:
        import: security-variable.yml
    application:
        name: PersonalSns
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/sns-ryu
        username: root
        password: ${mysql.password}
    thymeleaf:
        cache: false
    mvc:
        static-path-pattern: /static/**
mybatis:
    mapper-locations: mappers/*Mapper.xml