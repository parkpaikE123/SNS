<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
	
	<section layout:fragment="contents">
		<div class="d-flex justify-content-center mt-2">
			<h2>pinkstar join</h2>
		</div>	
		<div class="d-flex justify-content-center align-items-center">
			<div class="join-box bg-secondary mt-4 rounded-lg p-5">
				<div class="d-flex">
					<input type="text" class="join-input form-control my-2" id="loginIdInput" placeholder="아이디">
					<button type="button" class="btn btn-block btn-primary mb-2 ml-4 col-3" id="isDuplicateBtn">중복 확인</button>
				</div>
				<div class="small text-success d-none" id="availableText">사용가능한 ID입니다</div>
				<div class="small text-danger d-none" id="duplicateText">중복된 ID입니다</div>
				<input type="password" class="join-input my-3 form-control" id="passwordInput" placeholder="비밀번호">
				<input type="password" class="join-input my-3 form-control" id="passwordConfirmInput" placeholder="비밀번호 확인">
				<input type="text" class="join-input my-3 form-control" id="nameInput" placeholder="이름">
				<input type="text" class="join-input my-3 form-control" id="emailInput" placeholder="이메일">
				<button type="button" class="btn form-control btn-dark mt-2" id="joinBtn">회원가입</button><br>
				<div class="d-flex align-items-center justify-content-between mt-4">
					<label class="small mr-3">이미 아이디가 있으신가요?</label>
					<a href="/user/login-view" class="btn btn-primary">로그인</a>
				</div>
			</div>
		</div>
	</section>
	
	<script layout:fragment="script">
		$(function() {
			
			// 중복 검사 여부
			var isDuplicateCheck = false;
			// 중복 여부
			var isDuplicateId = true;
			
			$("#loginIdInput").on("input", function() {
				// 중복 확인 관련 값 초기화
				isDuplicateCheck = false;
				isDuplicateId = true;
				
				$("#availableText").addClass("d-none");
				$("#duplicateText").addClass("d-none");
			});
			
			// 중복 체크 기능
			$("#isDuplicateBtn").on("click", function() {
				
				let loginId = $("#loginIdInput").val();
				
				if(loginId == "") {
					alert("아이디를 입력하세요");
					return;
				}
				
				$.ajax({
					type:"get"
					, url:"/user/duplicate-id"
					, data:{"loginId":loginId}
					, success:function(response) {
						
						isDuplicateCheck = true;
						
						isDuplicateId = response.isDuplicate;
						
						if(response.isDuplicate) {
								
							$("#duplicateText").removeClass("d-none");
							$("#availableText").addClass("d-none");
						} else {
								
							$("#availableText").removeClass("d-none");
							$("#duplicateText").addClass("d-none");
						}
					}
					, error:function() {
						alert("중복확인 에러");
					}
				})
				
			});
			
			$("#joinBtn").on("click", function() {
				let loginId = $("#loginIdInput").val();
				let password = $("#passwordInput").val();
				let passwordConfirm = $("#passwordConfirmInput").val();
				let name = $("#nameInput").val();
				let email = $("#emailInput").val();
				
				if(loginId == "") {
					alert("아이디를 입력하세요");
					return;
				}
				
				// 중복 검사를 안했을 경우
				if(!isDuplicateCheck){
					alert("중복 검사를 수행해주세요");
					return;
				} 
				
				// 중복 검사 결과 중복인경우
				if(isDuplicateId) {
					alert("아이디가 중복되었습니다");
					return;
				} 
				
				if(password == "") {
					alert("비밀번호를 입력하세요");
					return;
				}
				
				if(password != passwordConfirm) {
					alert("비밀번호가 일치하지 않습니다");
					return;
				}
				if(name == "") {
					alert("이름을 입력하세요");
					return;
				}
				if(email == "") {
					alert("이메일을 입력하세요");
					return;
				}
				
				$.ajax({
					type:"post"
					, url:"/user/join"
					, data:{"loginId":loginId, "password":password, "name":name,"email":email}
					, success:function(response) {
						if(response.result == "success") {
							location.href="/user/login-view";
						} else {
							alert("회원가입 실패");
						}
					}
					, error:function() {
						alert("회원가입 에러!!");
					}
				});
				
			});
		});	
		
	
	</script>

</html>
