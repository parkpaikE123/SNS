<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
	
	<section layout:fragment="contents">
		<div class="d-flex justify-content-center align-items-center">
			<div class="join-box bg-secondary mt-4 rounded-lg p-4">
				<label>아이디</label>
				<div class="d-flex">
					<input type="text" class="form-control" id="loginIdInput">
					<button type="button" class="btn btn-block btn-primary ml-4 col-4" id="isDuplicateBtn">중복 확인</button>
				</div>
				<label>비밀번호</label>
				<input type="text" class="form-control" id="passwordInput">
				<label>비밀번호 확인</label>
				<input type="text" class="form-control" id="passwordConfirmInput">
				<label>이름</label>
				<input type="text" class="form-control" id="nameInput">
				<label>이메일</label>
				<input type="text" class="form-control" id="emailInput">
				<button type="button" class="btn btn-dark mt-2" id="joinBtn">회원가입</button>
			</div>
		</div>
	</section>
	
	<script layout:fragment="script">
		$(function() {
			$("#joinBtn").on("click", function() {
				let loginId = $("#loginIdInput").val();
				let password = $("#passwordInput").val();
				let passwordConfirm = $("#passwordConfirmInput").val();
				let name = $("#nameInput").val();
				let email = $("#emailInput").val();
				
				if(loginId == "") {
					alert("아이디를 입력하세요");
					return;
				}
				
				if(password == "") {
					alert("비밀번호를 입력하세요");
					return;
				}
				
				if(password != passwordConfirm) {
					alert("비밀번호가 일치하지 않습니다");
					return;
				}
				if(name == "") {
					alert("이름을 입력하세요");
					return;
				}
				if(email == "") {
					alert("이메일을 입력하세요");
					return;
				}
				
				$.ajax({
					type:"POST"
					, url:"/user/join"
					, data:{"loginId":loginId, "password":password, "name":name,"email":email}
					, success:function(response) {
						if(response.result == "success") {
							alert("회원가입 성공");
							location.href="/user/login-view";
						} else {
							alert("회원가입 실패");
						}
					}
					, error:function() {
						alert("회원가입 에러!!");
					}
				});
				
			});
		});	
		
	
	</script>

</html>
