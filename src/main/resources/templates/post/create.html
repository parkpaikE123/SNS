<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
        
        <section layout:fragment="contents" class="d-flex justify-content-center">
        	<div class="create-page mb-4 mt-3">
        		<div class="top">
        			<div class="d-flex justify-content-center align-items-center mt-4">
	        			<div>
	        				<i class="btn inputImage bi bi-file-earmark-image" id="imageInput"></i>
		        			<span class="ml-2">사진을 첨부해주세요</span>
		        			<input type="file" class="mt-4 form-control" id="fileInput">
		        			<br>
	        			</div>
        			</div>
        		</div>
        		<hr>
        		<input type="text" class="no-border form-control" placeholder="문구 추가.." id="contentsInput">
        		<hr>
        		<div class="bottom">
        			<button class="btn my-3 option-btn btn-light form-control" id="memberBtn">
        				<i class="bi bi-person-circle"></i>사람 태그
        			</button>
        			<br>
        			<button class="btn my-3 option-btn btn-light form-control" id="locationBtn">
        				<i class="bi bi-geo-alt"></i>위치 추가
        			</button> 
        			<br>
        			<button class="btn my-3 option-btn btn-light form-control" id="musicBtn">
        				<i class="bi bi-music-note-beamed"></i>음악 추가
        			</button> 
        			<br>
        			<button type="button" class="btn create-button form-control mb-2 text-dark">
        				<i class="bi bi-star text-dark mb-4"></i>게시하기
        			</button>
        		</div>
        	</div>
        </section>
        
        <script layout:fragment="script">
        	$(function() {
        		
        		$(".create-button").on("click", function() {
        			
        			let contents = $("#contentsInput").val();
        			
        			let file = $("#fileInput")[0].files[0];
        			
        			if(contents == "") {
        				alert("문구를 추가해주세요");
        				return;
        			}
        			if(file == null) {
        				alert("사진을 첨부해주세요");
        				return;
        			}
        			
        			let formData = new FormData();
       				formData.append("contents", contents);
       				formData.append("imageFile", file);
        			
        			
        			$.ajax({
        				type:"post"
        				,url:"/post/create"
        				,data:formData
        				, enctype:"multipart/form-data" // 파일 업로드시 추가 옵션
           				, processData:false // 파일 업로드시 추가 옵션
           				, contentType:false // 파일 업로드시 추가 옵션
        				,success:function(response) {
        					if(response.result == "success") {
        						location.href="/post/list-view";
        					} else {
        						alert("게시글 작성 실패");
        					}
        				}
        				,error:function() {
        					alert("게시글 작성 에러");
        				}
        			});
        			
        		});
        	})
        </script>
        
</html>
